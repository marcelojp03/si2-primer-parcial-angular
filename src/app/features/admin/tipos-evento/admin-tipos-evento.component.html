<p-toast />
<p-confirmDialog />

@if (loading && tipos().length === 0) {
<div class="border border-surface rounded-lg py-12">
    <div class="flex flex-col items-center justify-center">
        <i class="pi pi-spin pi-spinner text-4xl text-primary"></i>
        <span class="mt-3 text-surface-500">Cargando tipos de evento...</span>
    </div>
</div>
} @else {
<p-table
    #dt
    [value]="tipos()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['nombre', 'descripcion']"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rowHover]="true"
    dataKey="tipoEventoId"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tipos"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Tipos de Evento</h5>
            <div class="flex gap-2">
                <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (click)="cargar()" pTooltip="Actualizar" />
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Buscar..." />
                </p-iconfield>
                <p-button label="Nuevo" icon="pi pi-plus" (click)="abrirNuevo()" />
            </div>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="tipoEventoId" style="min-width: 5rem">ID <p-sortIcon field="tipoEventoId" /></th>
            <th pSortableColumn="nombre" style="min-width: 12rem">Nombre <p-sortIcon field="nombre" /></th>
            <th pSortableColumn="descripcion" style="min-width: 16rem">Descripción <p-sortIcon field="descripcion" /></th>
            <th pSortableColumn="activo" style="min-width: 6rem">Estado <p-sortIcon field="activo" /></th>
            <th style="min-width: 8rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-t>
        <tr>
            <td>{{ t.tipoEventoId }}</td>
            <td>{{ t.nombre }}</td>
            <td>{{ t.descripcion || '-' }}</td>
            <td><p-tag [value]="t.activo ? 'Activo' : 'Inactivo'" [severity]="t.activo ? 'success' : 'danger'" /></td>
            <td>
                <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" class="mr-2" (click)="abrirEdicion(t)" pTooltip="Editar" />
                <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (click)="confirmarEliminar(t)" pTooltip="Eliminar" />
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr><td colspan="5" class="text-center p-4">No se encontraron tipos de evento.</td></tr>
    </ng-template>
</p-table>
}

<!-- Crear / Editar Dialog -->
<p-dialog [(visible)]="dialogVisible" [style]="{ width: '450px' }" [header]="editando ? 'Editar Tipo de Evento' : 'Nuevo Tipo de Evento'" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label for="nombre" class="font-semibold">Nombre</label>
                <input pInputText id="nombre" [(ngModel)]="form.nombre" placeholder="Nombre del tipo" required />
            </div>
            <div class="flex flex-col gap-2">
                <label for="desc" class="font-semibold">Descripción</label>
                <textarea pTextarea id="desc" [(ngModel)]="form.descripcion" rows="3" placeholder="Descripción (opcional)"></textarea>
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" [text]="true" (click)="dialogVisible = false" />
        <p-button label="Guardar" icon="pi pi-check" (click)="guardar()" [loading]="saving" />
    </ng-template>
</p-dialog>
