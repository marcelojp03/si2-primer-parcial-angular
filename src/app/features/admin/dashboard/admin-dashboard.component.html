<div class="grid grid-cols-12 gap-8">
    <div class="col-span-12 flex items-center justify-between">
        <h5 class="m-0 text-xl font-semibold">Dashboard</h5>
        <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (onClick)="cargar()" pTooltip="Actualizar" />
    </div>
    <div class="col-span-12 lg:col-span-4">
        <p-card>
            <div class="flex items-center justify-between">
                <div>
                    <span class="block text-surface-500 font-medium mb-3">Empresas</span>
                    <div class="text-surface-900 dark:text-surface-0 font-bold text-4xl">{{ totalEmpresas() }}</div>
                </div>
                <div class="flex items-center justify-center bg-blue-100 dark:bg-blue-900/30 rounded-full" style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-building text-blue-500 text-xl"></i>
                </div>
            </div>
            <div class="mt-4">
                <p-button label="Ver empresas" icon="pi pi-arrow-right" size="small" [text]="true" (onClick)="router.navigate(['/admin/empresas'])" />
            </div>
        </p-card>
    </div>

    <div class="col-span-12 lg:col-span-4">
        <p-card>
            <div class="flex items-center justify-between">
                <div>
                    <span class="block text-surface-500 font-medium mb-3">Tipos de Evento</span>
                    <div class="text-surface-900 dark:text-surface-0 font-bold text-4xl">{{ totalTipos() }}</div>
                </div>
                <div class="flex items-center justify-center bg-green-100 dark:bg-green-900/30 rounded-full" style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-tags text-green-500 text-xl"></i>
                </div>
            </div>
            <div class="mt-4">
                <p-button label="Ver tipos" icon="pi pi-arrow-right" size="small" [text]="true" (onClick)="router.navigate(['/admin/tipos-evento'])" />
            </div>
        </p-card>
    </div>

    <div class="col-span-12 lg:col-span-4">
        <p-card>
            <div class="flex items-center justify-between">
                <div>
                    <span class="block text-surface-500 font-medium mb-3">Transacciones</span>
                    <div class="text-surface-900 dark:text-surface-0 font-bold text-4xl">{{ totalTransacciones() }}</div>
                </div>
                <div class="flex items-center justify-center bg-orange-100 dark:bg-orange-900/30 rounded-full" style="width: 2.5rem; height: 2.5rem">
                    <i class="pi pi-credit-card text-orange-500 text-xl"></i>
                </div>
            </div>
            <div class="mt-4">
                <p-button label="Ver transacciones" icon="pi pi-arrow-right" size="small" [text]="true" (onClick)="router.navigate(['/admin/transacciones'])" />
            </div>
        </p-card>
    </div>

    <div class="col-span-12">
        <p-card header="Accesos rápidos">
            <div class="flex flex-wrap gap-3">
                <p-button label="Crear Usuario" icon="pi pi-user-plus" (onClick)="router.navigate(['/admin/usuarios'])" />
                <p-button label="Ir a Tienda" icon="pi pi-shopping-cart" severity="warn" (onClick)="router.navigate(['/tienda'])" />
            </div>
        </p-card>
    </div>
</div>
